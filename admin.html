<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#241517">
<title>Cayers Admin</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#241517;--card:#33201f;--ink:#fbeae6;--mute:#c4a29f;--berry:#ff7d96;--cocoa:#e8c4b0;--line:#4b3030;--ok:#6fd59a;--err:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito","Segoe UI",system-ui,sans-serif;padding:24px;display:flex;justify-content:center;min-height:100vh}
.wrap{width:100%;max-width:420px;margin-top:40px}
h1{font:400 2rem/1 "Abril Fatface",Georgia,serif;margin:0 0 20px;text-align:center;color:var(--ink)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px}
label{font-weight:800;display:block;margin-bottom:12px;font-size:0.95rem}
input[type="password"]{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:16px;text-align:center;letter-spacing:4px;font-size:1.2rem}
button{width:100%;padding:16px;border-radius:14px;border:0;background:var(--berry);color:var(--bg);font-weight:800;font-size:1.1rem;font-family:inherit;cursor:pointer}
button:disabled{opacity:0.5;cursor:default}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border:0;padding-bottom:0}
.toggle-row span{font-weight:800}
.switch{position:relative;display:inline-block;width:56px;height:32px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#4b3030;transition:.3s;border-radius:32px}
.slider:before{position:absolute;content:"";height:24px;width:24px;left:4px;bottom:4px;background-color:white;transition:.3s;border-radius:50%}
input:checked + .slider{background-color:var(--ok)}
input:checked + .slider:before{transform:translateX(24px)}
input:disabled + .slider{opacity:.6;cursor:default}
.hide{display:none!important}
.msg{text-align:center;font-weight:700;margin-top:16px;min-height:24px}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
#dashView.busy{pointer-events:none}

/* focus-visible */
button:focus-visible,
input[type="password"]:focus-visible,
.switch input:focus-visible + .slider{
  outline:2px solid var(--ink);
  outline-offset:3px;
}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .6s ease}
#splash.gone{opacity:0;pointer-events:none}
.splash-inner{text-align:center;display:flex;flex-direction:column;align-items:center}
.splash-logo{font:400 clamp(3rem,16vw,5rem)/.95 "Abril Fatface",Georgia,serif;color:var(--ink);letter-spacing:-.02em;text-align:center;will-change:transform,opacity}
#splash .splash-logo span{display:inline-block;opacity:0;animation:spell .45s cubic-bezier(.2,.7,.3,1) forwards}
#splash .splash-logo span:nth-child(1){animation-delay:.10s}
#splash .splash-logo span:nth-child(2){animation-delay:.30s}
#splash .splash-logo span:nth-child(3){animation-delay:.50s}
#splash .splash-logo span:nth-child(4){animation-delay:.70s}
#splash .splash-logo span:nth-child(5){animation-delay:.90s}
#splash .splash-logo span:nth-child(6){animation-delay:1.10s}
@keyframes spell{from{opacity:0;transform:translateY(8px) scale(.85)}to{opacity:1;transform:none}}
#splash .dots,#splash .note{opacity:0;animation:fadein .5s ease 1.30s forwards}
@keyframes fadein{to{opacity:1}}
.dots{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:40px;pointer-events:none;will-change:opacity}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--berry);animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-12px);opacity:1}}

/* ---------- content reveal ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.reveal{opacity:0}
.reveal.in{animation:riseIn .85s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0s)}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1}.reveal.in{animation:none}}

/* ---------- saving overlay ---------- */
#saving{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;opacity:1;transition:opacity .6s ease}
#saving.gone{opacity:0;pointer-events:none}
#saving.hide{display:none}
#saving .splash-logo{transition:opacity .45s ease,transform .45s ease}
#saving .dots,#saving .note{transition:opacity .3s ease}
.okwrap{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;opacity:0;transform:scale(.45);transition:opacity .45s ease,transform .5s cubic-bezier(.2,.8,.3,1.2);pointer-events:none}
.okwrap svg{width:100%;height:100%;display:block;overflow:visible}
.okwrap .ring{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-dasharray:1 2;stroke-dashoffset:1.06;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .7s ease}
.okwrap .tick{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1.06;transition:stroke-dashoffset .55s ease}
#saving.s-circle .splash-logo{opacity:0;transform:scale(.35)}
#saving.s-circle .dots,#saving.s-circle .note{opacity:0}
#saving.s-circle .okwrap{opacity:1;transform:scale(1)}
#saving.s-circle .ring{stroke-dashoffset:0}
#saving.s-tick .tick{stroke-dashoffset:0}
.oktext{position:absolute;left:0;right:0;top:50%;margin-top:88px;text-align:center;font:400 1.7rem/1.1 "Abril Fatface",Georgia,serif;color:var(--ink);opacity:0;transition:opacity .5s ease;pointer-events:none}
#saving.s-tick .oktext{opacity:1}
#saving.s-undo .ring{stroke-dashoffset:1.06;transition:stroke-dashoffset .7s ease .25s}
#saving.s-undo .okwrap{opacity:0;transition:opacity 1.2s ease .1s}
#saving.s-undo .oktext{opacity:0;transition:opacity 1.2s ease}
@media(prefers-reduced-motion:reduce){#splash,#saving{transition:none}.dots i{animation:none;opacity:.8}#splash .splash-logo span,#splash .dots,#splash .note{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-inner">
    <div class="splash-logo" role="img" aria-label="Cayers"><span aria-hidden="true">C</span><span aria-hidden="true">a</span><span aria-hidden="true">y</span><span aria-hidden="true">e</span><span aria-hidden="true">r</span><span aria-hidden="true">s</span></div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="note" style="margin-top:18px;text-align:center;color:var(--mute);font-size:.9rem">Whipping up the dashboard&hellip;</p>
  </div>
</div>

<!-- SAVING OVERLAY -->
<div id="saving" class="hide" role="status" aria-live="polite">
  <div class="splash-inner">
    <div class="splash-logo">Cayers</div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="note" style="margin-top:18px;text-align:center;color:var(--mute);font-size:.9rem">Saving your changes&hellip;</p>
  </div>
  <div class="oktext" aria-hidden="true">Changes Saved</div>
  <div class="okwrap" aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="ring" cx="50" cy="50" r="44" pathLength="1"/><path class="tick" d="M30 52 L45 66 L71 36" pathLength="1"/></svg></div>
</div>

<div class="wrap">
  <h1><span id="target-logo">Cayers</span><span id="admin-word" style="opacity:0"> Admin</span></h1>

  <!-- LOGIN SCREEN -->
  <div id="loginView" class="card">
    <label for="pin">Enter PIN</label>
    <input type="password" id="pin" inputmode="numeric" placeholder="••••"
           autocomplete="off" spellcheck="false" maxlength="12" aria-label="Admin PIN">
    <button id="loginBtn">Unlock Dashboard</button>
    <div id="loginMsg" class="msg err" role="status" aria-live="polite"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashView" class="hide">
    <div class="card">
      <div class="toggle-row">
        <span id="status-label">Store Status</span>
        <label class="switch">
          <input type="checkbox" id="storeStatus" aria-labelledby="status-label">
          <span class="slider" aria-hidden="true"></span>
        </label>
      </div>
      <p id="statusText" style="text-align:center;font-weight:800;color:var(--ok);margin:10px 0 0">OPEN</p>
    </div>

    <div class="card">
      <label>Mark Days as SOLD OUT</label>
      <div class="toggle-row"><span id="day-mon">Monday</span><label class="switch"><input type="checkbox" class="soldOutDay" value="Monday" aria-labelledby="day-mon"><span class="slider" aria-hidden="true"></span></label></div>
      <div class="toggle-row"><span id="day-tue">Tuesday</span><label class="switch"><input type="checkbox" class="soldOutDay" value="Tuesday" aria-labelledby="day-tue"><span class="slider" aria-hidden="true"></span></label></div>
      <div class="toggle-row"><span id="day-wed">Wednesday</span><label class="switch"><input type="checkbox" class="soldOutDay" value="Wednesday" aria-labelledby="day-wed"><span class="slider" aria-hidden="true"></span></label></div>
      <div class="toggle-row"><span id="day-thu">Thursday</span><label class="switch"><input type="checkbox" class="soldOutDay" value="Thursday" aria-labelledby="day-thu"><span class="slider" aria-hidden="true"></span></label></div>
      <div class="toggle-row"><span id="day-fri">Friday</span><label class="switch"><input type="checkbox" class="soldOutDay" value="Friday" aria-labelledby="day-fri"><span class="slider" aria-hidden="true"></span></label></div>
    </div>

    <button id="saveBtn" style="background:var(--cocoa);color:var(--bg);margin-bottom:24px">Save Changes</button>
    <div id="dashMsg" class="msg" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzzYEoHmxy4_WtQbvSlszi8iOOl6YIdcuL-tVuA17d8rOMZhQ_0z4sFgfqIRo0rQGNH/exec";

const TIMING = {
  splashMin: 2000,
  splashReduceMin: 500,
  splashFallback: 6500,
  splashFlipMs: 850,
  splashFlipCleanup: 950,
  splashAdminDelay: 550,
  saveMin: 800,
  saveFadeMs: 600,
  saveFadeSlowMs: 1000,
  successCircle: 400,
  successTick: 700,
  successUndo: 500,
  revealStep: 0.07,
  failedLoginDelay: 800
};

const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let pin = "";
let isSaving = false;

/* ================================================================
   API helpers
   ================================================================ */
async function postJSON(payload) {
  const r = await fetch(ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function getSettings() {
  const r = await fetch(ENDPOINT + "?action=get_settings");
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

/* ================================================================
   Reveal helper — same "riseIn" cascade
   ================================================================ */
function revealEls(els) {
  els = els.filter(el => el && !el.classList.contains("hide") && !el.classList.contains("reveal"));
  if (!els.length) return;

  if (reduceMotion()) {
    els.forEach(el => el.classList.add("reveal", "in"));
    return;
  }

  try {
    els.forEach((el, i) => {
      el.style.setProperty("--d", (i * TIMING.revealStep).toFixed(2) + "s");
      el.classList.add("reveal");
    });
    void document.body.offsetWidth;
    els.forEach(el => el.classList.add("in"));
  } catch {
    // Hard fallback: never leave content invisible.
    els.forEach(el => el.classList.add("reveal", "in"));
  }
}

function revealCurrentView() {
  if (!$("#dashView").classList.contains("hide")) {
    revealEls([...$$("#dashView > *")]);
  } else {
    revealEls([...$$(".wrap > *")].filter(el => el.tagName !== "H1"));
  }
}

/* ================================================================
   Splash → header FLIP
   ================================================================ */
const splashShownAt = Date.now();

function fadeOutNow(el, ms) {
  if (!el) return;
  const cur = getComputedStyle(el).opacity;
  el.style.animation = "none";
  el.style.opacity = cur;
  void el.offsetWidth;
  el.style.transition = `opacity ${ms}ms ease`;
  el.style.opacity = "0";
}

async function hideSplash() {
  const s = document.getElementById("splash");
  if (!s || s.dataset.done) return;
  s.dataset.done = "1";

  const reduce = reduceMotion();
  const minMs = reduce ? TIMING.splashReduceMin : TIMING.splashMin;
  const wait = Math.max(0, minMs - (Date.now() - splashShownAt));
  if (wait) await sleep(wait);

  const adminWord = document.getElementById("admin-word");
  const splashLogo = s.querySelector(".splash-logo");
  const targetLogo = document.getElementById("target-logo");

  if (reduce || !splashLogo || !targetLogo) {
    s.remove();
    if (adminWord) adminWord.style.opacity = "1";
    revealCurrentView();
    return;
  }

  /* ---- measure both logos ---- */
  const sRect = splashLogo.getBoundingClientRect();
  const tRect = targetLogo.getBoundingClientRect();
  const scaleX = sRect.width / tRect.width;
  const scaleY = sRect.height / tRect.height;
  const dx = (sRect.left + sRect.width / 2) - (tRect.left + tRect.width / 2);
  const dy = (sRect.top + sRect.height / 2) - (tRect.top + tRect.height / 2);

  /* ---- instant handoff ---- */
  splashLogo.style.opacity = "0";
  targetLogo.style.position = "relative";
  targetLogo.style.zIndex = "50";
  targetLogo.style.transformOrigin = "center center";
  targetLogo.style.transform = `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})`;
  targetLogo.style.willChange = "transform";
  void targetLogo.offsetWidth;

  /* ---- fade splash chrome ---- */
  s.style.transition = "background-color .6s ease";
  s.style.backgroundColor = "transparent";
  s.style.pointerEvents = "none";
  fadeOutNow(s.querySelector(".dots"), 250);
  fadeOutNow(s.querySelector(".note"), 250);

  revealCurrentView();

  /* ---- glide real logo home ---- */
  targetLogo.style.transition = `transform ${TIMING.splashFlipMs}ms cubic-bezier(.22,1,.36,1)`;
  targetLogo.style.transform = "translate(0px, 0px) scale(1, 1)";

  if (adminWord) {
    setTimeout(() => {
      adminWord.style.transition = "opacity .5s ease";
      adminWord.style.opacity = "1";
    }, TIMING.splashAdminDelay);
  }

  setTimeout(() => {
    targetLogo.style.transition = "";
    targetLogo.style.transform = "";
    targetLogo.style.transformOrigin = "";
    targetLogo.style.willChange = "";
    targetLogo.style.position = "";
    targetLogo.style.zIndex = "";
    s.remove();
  }, TIMING.splashFlipCleanup);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(hideSplash);
window.addEventListener("load", hideSplash);
setTimeout(hideSplash, TIMING.splashFallback);

/* ================================================================
   Saving overlay (returns a promise that resolves after fade-out)
   ================================================================ */
function showSaving(on, opts = {}) {
  const s = $("#saving");
  if (!s) return Promise.resolve();
  const { slow = false } = opts;

  if (on) {
    // Reset any leftover success state from a previous save
    const note = s.querySelector(".note");
    if (note) note.textContent = "Saving your changes…";
    s.classList.remove("s-circle", "s-tick", "s-undo");
    s.style.transition = "none";
    s.classList.remove("hide");
    s.classList.add("gone");
    void s.offsetWidth;
    s.style.transition = "opacity .7s ease";
    s.classList.remove("gone");
    return Promise.resolve();
  }

  const ms = slow ? TIMING.saveFadeSlowMs : TIMING.saveFadeMs;
  return new Promise(resolve => {
    s.style.transition = `opacity ${ms}ms ease`;
    s.classList.add("gone");
    setTimeout(() => {
      if (s.classList.contains("gone")) {
        s.classList.add("hide");
        s.classList.remove("s-circle", "s-tick", "s-undo");
      }
      resolve();
    }, ms);
  });
}

async function playSuccess() {
  const s = $("#saving");
  if (!s) return;
  if (reduceMotion()) { await sleep(300); return; }
  const note = s.querySelector(".note");
  if (note) note.textContent = "Changes saved";
  s.classList.add("s-circle"); await sleep(TIMING.successCircle);
  s.classList.add("s-tick");   await sleep(TIMING.successTick);
  s.classList.remove("s-tick");
  s.classList.add("s-undo");   await sleep(TIMING.successUndo);
}

/* ================================================================
   Boot — restore session + background validation
   ================================================================ */
async function validateSession() {
  const saved = sessionStorage.getItem("cayers_pin");
  if (!saved) return;
  try {
    const d = await postJSON({ action: "admin", type: "check", pin: saved });
    if (!d.ok) {
      sessionStorage.removeItem("cayers_pin");
      pin = "";
      showLogin("Session expired. Please log in again.");
    }
  } catch {
    // network failure — keep session so the user can retry
  }
}

if (sessionStorage.getItem("cayers_pin")) {
  pin = sessionStorage.getItem("cayers_pin");
  showDashboard();
  validateSession();
}

/* ================================================================
   Login
   ================================================================ */
async function handleLogin() {
  const enteredPin = $("#pin").value.trim();
  const btn = $("#loginBtn");
  const msg = $("#loginMsg");
  if (!enteredPin || btn.disabled) return;

  btn.disabled = true;
  msg.classList.remove("ok");
  msg.classList.add("err");
  msg.textContent = "Checking…";

  let success = false;
  try {
    const d = await postJSON({ action: "admin", type: "check", pin: enteredPin });
    if (d.ok) {
      pin = enteredPin;
      sessionStorage.setItem("cayers_pin", pin);
      msg.textContent = "";
      success = true;
    } else {
      msg.textContent = "Wrong PIN";
    }
  } catch {
    msg.textContent = "Connection error.";
  }

  if (success) {
    await showDashboard();
  } else {
    // small delay to slow brute-force
    await sleep(TIMING.failedLoginDelay);
    btn.disabled = false;
  }
}

$("#loginBtn").addEventListener("click", handleLogin);
$("#pin").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); handleLogin(); }
});

/* ================================================================
   View switching
   ================================================================ */
async function showDashboard() {
  $("#loginView").classList.add("hide");
  const dash = $("#dashView");
  dash.classList.remove("hide");
  dash.classList.add("busy");

  const loadPromise = loadSettings();

  const splash = document.getElementById("splash");
  if (!splash || splash.dataset.done) {
    revealEls([...$$("#dashView > *")]);
  }

  await loadPromise;
  dash.classList.remove("busy");
}

function showLogin(message = "") {
  $("#dashView").classList.add("hide");
  const lv = $("#loginView");
  lv.classList.remove("hide", "reveal", "in");
  $("#pin").value = "";
  $("#loginBtn").disabled = false;

  const msg = $("#loginMsg");
  msg.classList.remove("ok");
  msg.classList.add("err");
  msg.textContent = message;

  requestAnimationFrame(() => revealEls([lv]));
}

/* ================================================================
   Load settings
   ================================================================ */
async function loadSettings() {
  try {
    const d = await getSettings();
    if (!d.ok) {
      showDashMsg("Failed to load settings: " + (d.error || "unknown error"), "err");
      return;
    }

    $("#storeStatus").checked = (d.storeStatus === "OPEN");
    updateStatusText();

    $$(".soldOutDay").forEach(cb => cb.checked = false);
    if (Array.isArray(d.soldOutDays)) {
      d.soldOutDays.forEach(day => {
        const cb = document.querySelector(`.soldOutDay[value="${day}"]`);
        if (cb) cb.checked = true;
      });
    }
  } catch {
    showDashMsg("Failed to load settings", "err");
  }
}

/* ================================================================
   Store status toggle
   ================================================================ */
$("#storeStatus").addEventListener("change", updateStatusText);
function updateStatusText() {
  const open = $("#storeStatus").checked;
  const el = $("#statusText");
  el.textContent = open ? "OPEN" : "CLOSED";
  el.style.color = open ? "var(--ok)" : "var(--err)";
}

/* ================================================================
   Save
   ================================================================ */
function setDashInputsDisabled(disabled) {
  $$("#dashView input, #dashView button").forEach(el => el.disabled = disabled);
}

$("#saveBtn").addEventListener("click", async () => {
  if (isSaving) return;
  isSaving = true;

  const btn = $("#saveBtn");
  btn.disabled = true;
  setDashInputsDisabled(true);
  showDashMsg("", "");
  document.body.style.overflow = "hidden";

  try {
    const storeStatus = $("#storeStatus").checked ? "OPEN" : "CLOSED";
    const soldOutDays = Array.from($$(".soldOutDay:checked")).map(cb => cb.value);
    const startedAt = Date.now();

    showSaving(true);
    await sleep(100); // let the overlay paint

    let succeeded = false;
    try {
      const d = await postJSON({
        action: "admin", type: "update", pin,
        storeStatus, soldOutDays
      });
      if (d.ok) {
        succeeded = true;
      } else {
        showDashMsg("Error saving: " + (d.error || "unknown error"), "err");
      }
    } catch {
      showDashMsg("Connection error.", "err");
    }

    // keep the "Saving..." state visible long enough to feel intentional
    const remaining = Math.max(0, TIMING.saveMin - (Date.now() - startedAt));
    if (remaining) await sleep(remaining);

    if (succeeded) {
      await playSuccess();
      await showSaving(false, { slow: true });
      showDashMsg("Saved successfully!", "ok");
    } else {
      await showSaving(false);
    }
  } finally {
    document.body.style.overflow = "";
    btn.disabled = false;
    setDashInputsDisabled(false);
    isSaving = false;
  }
});

/* ================================================================
   Message helper
   ================================================================ */
function showDashMsg(text, type) {
  const m = $("#dashMsg");
  m.textContent = text;
  m.classList.remove("err", "ok");
  if (type) m.classList.add(type);
}
</script>
</body>
</html>
