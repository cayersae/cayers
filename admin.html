<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#241517">
<title>Cayers Admin</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#241517;--card:#33201f;--ink:#fbeae6;--mute:#c4a29f;--berry:#ff7d96;--cocoa:#e8c4b0;--line:#4b3030;--ok:#6fd59a;--err:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito","Segoe UI",system-ui,sans-serif;padding:24px;display:flex;justify-content:center;min-height:100vh}
.wrap{width:100%;max-width:420px;margin-top:40px}
h1{font:400 2rem/1 "Abril Fatface",Georgia,serif;margin:0 0 20px;text-align:center;color:var(--ink)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px}
label{font-weight:800;display:block;margin-bottom:12px;font-size:0.95rem}
#loginView label{text-align:center}
input[type="password"]{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:16px;text-align:center;letter-spacing:4px;font-size:1.2rem}
button{width:100%;padding:16px;border-radius:14px;border:0;background:var(--berry);color:var(--bg);font-weight:800;font-size:1.1rem;font-family:inherit;cursor:pointer}
button:disabled{opacity:0.5;cursor:default}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border:0;padding-bottom:0}
.toggle-row span{font-weight:800}
.switch{position:relative;display:inline-block;width:56px;height:32px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#4b3030;transition:.3s;border-radius:32px}
.slider:before{position:absolute;content:"";height:24px;width:24px;left:4px;bottom:4px;background-color:white;transition:.3s;border-radius:50%}
input:checked + .slider{background-color:var(--ok)}
input:checked + .slider:before{transform:translateX(24px)}
input:disabled + .slider{opacity:.6;cursor:default}
.hide{display:none!important}
.msg{text-align:center;font-weight:700;margin-top:16px;min-height:24px}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
#dashView.busy{pointer-events:none}
#dashView.busy > *{visibility:hidden}
#logoutBtn{background:transparent;color:var(--mute);border:1.5px solid var(--line);margin-bottom:12px}
.session-note{text-align:center;color:var(--mute);font-size:.8rem;margin:0 0 16px}

button:focus-visible,
input[type="password"]:focus-visible,
.switch input:focus-visible + .slider{outline:2px solid var(--ink);outline-offset:3px}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .6s ease}
#splash.gone{opacity:0;pointer-events:none}
.splash-inner{text-align:center;display:flex;flex-direction:column;align-items:center}
.splash-logo{font:400 clamp(3rem,16vw,5rem)/.95 "Abril Fatface",Georgia,serif;color:var(--ink);letter-spacing:-.02em;text-align:center;will-change:transform,opacity}
#splash .splash-logo span{display:inline-block;opacity:0;animation:spell .45s cubic-bezier(.2,.7,.3,1) forwards}
#splash .splash-logo span:nth-child(1){animation-delay:.10s}
#splash .splash-logo span:nth-child(2){animation-delay:.30s}
#splash .splash-logo span:nth-child(3){animation-delay:.50s}
#splash .splash-logo span:nth-child(4){animation-delay:.70s}
#splash .splash-logo span:nth-child(5){animation-delay:.90s}
#splash .splash-logo span:nth-child(6){animation-delay:1.10s}
@keyframes spell{from{opacity:0;transform:translateY(8px) scale(.85)}to{opacity:1;transform:none}}
#splash .dots,#splash .note{opacity:0;animation:fadein .5s ease 1.30s forwards}
@keyframes fadein{to{opacity:1}}
.dots{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:40px;pointer-events:none;will-change:opacity}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--berry);animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-12px);opacity:1}}

/* ---------- content reveal ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.reveal{opacity:0}
.reveal.in{animation:riseIn .85s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0s)}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1}.reveal.in{animation:none}}

/* ---------- shared overlay ---------- */
.overlay{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;opacity:1;transition:opacity .6s ease}
.overlay.gone{opacity:0;pointer-events:none}
.overlay.hide{display:none}
.overlay .splash-logo{transition:opacity .45s ease,transform .45s ease}
.overlay .dots,.overlay .note{transition:opacity .3s ease}
.okwrap{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;opacity:0;transform:scale(.45);transition:opacity .45s ease,transform .5s cubic-bezier(.2,.8,.3,1.2);pointer-events:none}
.okwrap svg{width:100%;height:100%;display:block;overflow:visible}
.okwrap .ring{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-dasharray:1 2;stroke-dashoffset:1.06;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .7s ease,stroke .3s ease}
.okwrap .tick{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1.06;transition:stroke-dashoffset .55s ease}
.okwrap .cross{fill:none;stroke:var(--err);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1.06;transition:stroke-dashoffset .55s ease}
.overlay.s-circle .splash-logo{opacity:0;transform:scale(.35)}
.overlay.s-circle .dots,.overlay.s-circle .note{opacity:0}
.overlay.s-circle .okwrap{opacity:1;transform:scale(1)}
.overlay.s-circle .ring{stroke-dashoffset:0}
.overlay.s-tick .tick{stroke-dashoffset:0}
.overlay.s-err .ring{stroke:var(--err)}
.overlay.s-err .oktext{color:var(--err)}
.overlay.s-cross .cross{stroke-dashoffset:0}
.overlay.s-cross .oktext{opacity:1}
.oktext{position:absolute;left:0;right:0;top:50%;margin-top:88px;text-align:center;font:400 1.7rem/1.1 "Abril Fatface",Georgia,serif;color:var(--ink);opacity:0;transition:opacity .5s ease,color .3s ease;pointer-events:none}
.overlay.s-tick .oktext{opacity:1}
.overlay.s-undo .ring{stroke-dashoffset:1.06;transition:stroke-dashoffset .7s ease .25s}
.overlay.s-undo .okwrap{opacity:0;transition:opacity 1.2s ease .1s}
.overlay.s-undo .oktext{opacity:0;transition:opacity 1.2s ease}

/* ---------- logging out overlay ---------- */
#loggingout .splash-logo span{display:inline-block;opacity:0}
#loggingout .dots,#loggingout .note{opacity:0}
#loggingout.play .splash-logo span{animation:spell .45s cubic-bezier(.2,.7,.3,1) forwards}
#loggingout.play .splash-logo span:nth-child(1){animation-delay:.10s}
#loggingout.play .splash-logo span:nth-child(2){animation-delay:.30s}
#loggingout.play .splash-logo span:nth-child(3){animation-delay:.50s}
#loggingout.play .splash-logo span:nth-child(4){animation-delay:.70s}
#loggingout.play .splash-logo span:nth-child(5){animation-delay:.90s}
#loggingout.play .splash-logo span:nth-child(6){animation-delay:1.10s}
#loggingout.play .dots,#loggingout.play .note{animation:fadein .5s ease 1.30s forwards}

@media(prefers-reduced-motion:reduce){
  #splash,.overlay{transition:none}
  .dots i{animation:none;opacity:.8}
  #splash .splash-logo span,#splash .dots,#splash .note,
  #loggingout .splash-logo span,#loggingout .dots,#loggingout .note{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-inner">
    <div class="splash-logo" role="img" aria-label="Cayers"><span aria-hidden="true">C</span><span aria-hidden="true">a</span><span aria-hidden="true">y</span><span aria-hidden="true">e</span><span aria-hidden="true">r</span><span aria-hidden="true">s</span></div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="note" style="margin-top:18px;text-align:center;color:var(--mute);font-size:.9rem">Whipping up the dashboard&hellip;</p>
  </div>
</div>

<!-- SAVING OVERLAY -->
<div id="saving" class="overlay hide" role="status" aria-live="polite">
  <div class="splash-inner">
    <div class="splash-logo">Cayers</div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="note" style="margin-top:18px;text-align:center;color:var(--mute);font-size:.9rem">Saving your changes&hellip;</p>
  </div>
  <div class="oktext" aria-hidden="true">Changes Saved</div>
  <div class="okwrap" aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="ring" cx="50" cy="50" r="44" pathLength="1"/><path class="tick" d="M30 52 L45 66 L71 36" pathLength="1"/></svg></div>
</div>

<!-- AUTHING OVERLAY -->
<div id="authing" class="overlay hide" role="status" aria-live="polite">
  <div class="splash-inner">
    <div class="splash-logo">Cayers</div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="note" style="margin-top:18px;text-align:center;color:var(--mute);font-size:.9rem">Logging in&hellip;</p>
  </div>
  <div class="oktext" aria-hidden="true">Logged In</div>
  <div class="okwrap" aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="ring" cx="50" cy="50" r="44" pathLength="1"/><path class="tick" d="M30 52 L45 66 L71 36" pathLength="1"/><path class="cross" d="M35 35 L65 65 M65 35 L35 65" pathLength="1"/></svg></div>
</div>

<!-- LOGGING OUT OVERLAY -->
<div id="loggingout" class="overlay hide" role="status" aria-live="polite">
  <div class="splash-inner">
    <div class="splash-logo" role="img" aria-label="Cayers"><span aria-hidden="true">C</span><span aria-hidden="true">a</span><span aria-hidden="true">y</span><span aria-hidden="true">e</span><span aria-hidden="true">r</span><span aria-hidden="true">s</span></div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="note" style="margin-top:18px;text-align:center;color:var(--mute);font-size:.9rem">Logging you out&hellip;</p>
  </div>
</div>

<div class="wrap">
  <h1><span id="target-logo">Cayers</span><span id="admin-word" style="opacity:0"> Admin</span></h1>

  <!-- LOGIN SCREEN -->
  <div id="loginView" class="card">
    <label for="pin">Enter PIN</label>
    <input type="password" id="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
           placeholder="••••••" autocomplete="off" spellcheck="false" aria-label="Admin PIN">
    <button id="loginBtn">Authorise</button>
    <div id="loginMsg" class="msg err" role="status" aria-live="polite"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashView" class="hide">
    <div class="card">
      <div class="toggle-row">
        <span id="status-label">Store Status</span>
        <label class="switch">
          <input type="checkbox" id="storeStatus" aria-labelledby="status-label">
          <span class="slider" aria-hidden="true"></span>
        </label>
      </div>
      <p id="statusText" style="text-align:center;font-weight:800;color:var(--ok);margin:10px 0 0">OPEN</p>
    </div>

    <div class="card">
      <label>Mark Days as SOLD OUT</label>
      <div class="toggle-row"><span id="day-mon">Monday</span><label class="switch"><input type="checkbox" class="soldOutDay" value="Monday" aria-labelledby="day-mon"><span class="slider" aria-hidden="true"></span></label></div>
      <div class="toggle-row"><span id="day-tue">Tuesday</span><label class="switch"><input type="checkbox" class="soldOutDay" value="Tuesday" aria-labelledby="day-tue"><span class="slider" aria-hidden="true"></span></label></div>
      <div class="toggle-row"><span id="day-wed">Wednesday</span><label class="switch"><input type="checkbox" class="soldOutDay" value="Wednesday" aria-labelledby="day-wed"><span class="slider" aria-hidden="true"></span></label></div>
      <div class="toggle-row"><span id="day-thu">Thursday</span><label class="switch"><input type="checkbox" class="soldOutDay" value="Thursday" aria-labelledby="day-thu"><span class="slider" aria-hidden="true"></span></label></div>
      <div class="toggle-row"><span id="day-fri">Friday</span><label class="switch"><input type="checkbox" class="soldOutDay" value="Friday" aria-labelledby="day-fri"><span class="slider" aria-hidden="true"></span></label></div>
    </div>

    <button id="saveBtn" style="background:var(--cocoa);color:var(--bg);margin-bottom:12px">Save Changes</button>
    <button id="logoutBtn">Log Out</button>
    <p class="session-note">Session ends after 30 minutes of inactivity.</p>
    <div id="dashMsg" class="msg" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzzYEoHmxy4_WtQbvSlszi8iOOl6YIdcuL-tVuA17d8rOMZhQ_0z4sFgfqIRo0rQGNH/exec";

const TIMING = {
  splashMin: 2000,
  splashReduceMin: 500,
  splashFallback: 6500,
  splashFlipMs: 850,
  splashFlipCleanup: 950,
  splashAdminDelay: 550,
  overlayMinVisible: 800,
  overlayFadeMs: 600,
  overlayFadeSlowMs: 1000,
  successCircle: 400,
  successTick: 700,
  successUndo: 500,
  errorCircle: 400,
  errorCross: 700,
  errorUndo: 500,
  revealStep: 0.07,
  failedLoginDelay: 800,
  logoutMinVisible: 1800,
  logoutFadeMs: 600,
  settingsWaitMaxMs: 5000
};

const SESSION_MAX_MS  = 8 * 60 * 60 * 1000;
const SESSION_IDLE_MS = 30 * 60 * 1000;

const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let pin = "";
let isSaving = false;
let dashboardSettingsPromise = null;

/* ================================================================
   API helpers
   ================================================================ */
async function postJSON(payload) {
  const r = await fetch(ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function getSettings() {
  const r = await fetch(ENDPOINT + "?action=get_settings");
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

/* ================================================================
   Session storage
   ================================================================ */
function saveSession(value) {
  const now = Date.now();
  sessionStorage.setItem("cayers_pin", value);
  sessionStorage.setItem("cayers_exp", String(now + SESSION_MAX_MS));
  sessionStorage.setItem("cayers_last", String(now));
}

function touchSession() {
  if (sessionStorage.getItem("cayers_pin")) {
    sessionStorage.setItem("cayers_last", String(Date.now()));
  }
}

function sessionValid() {
  const p   = sessionStorage.getItem("cayers_pin");
  const exp = Number(sessionStorage.getItem("cayers_exp"));
  const last = Number(sessionStorage.getItem("cayers_last"));
  if (!p || !exp || !last) return false;
  if (!isFinite(exp) || !isFinite(last)) return false;
  const now = Date.now();
  if (now > exp) return false;
  if (now - last > SESSION_IDLE_MS) return false;
  return true;
}

function clearSession() {
  sessionStorage.removeItem("cayers_pin");
  sessionStorage.removeItem("cayers_exp");
  sessionStorage.removeItem("cayers_last");
  pin = "";
}

["pointerdown", "keydown", "touchstart"].forEach(ev =>
  document.addEventListener(ev, touchSession, { passive: true })
);

/* ================================================================
   Reveal helper
   ================================================================ */
function revealEls(els) {
  els = els.filter(el => el && !el.classList.contains("hide") && !el.classList.contains("reveal"));
  if (!els.length) return;

  if (reduceMotion()) {
    els.forEach(el => el.classList.add("reveal", "in"));
    return;
  }

  try {
    els.forEach((el, i) => {
      el.style.setProperty("--d", (i * TIMING.revealStep).toFixed(2) + "s");
      el.classList.add("reveal");
    });
    void document.body.offsetWidth;
    els.forEach(el => el.classList.add("in"));
  } catch {
    els.forEach(el => el.classList.add("reveal", "in"));
  }
}

function revealCurrentView() {
  if (!$("#dashView").classList.contains("hide")) {
    revealEls([...$$("#dashView > *")]);
  } else {
    revealEls([...$$(".wrap > *")].filter(el => el.tagName !== "H1"));
  }
}

/* ================================================================
   Splash → header FLIP
   ================================================================ */
const splashShownAt = Date.now();

function fadeOutNow(el, ms) {
  if (!el) return;
  const cur = getComputedStyle(el).opacity;
  el.style.animation = "none";
  el.style.opacity = cur;
  void el.offsetWidth;
  el.style.transition = `opacity ${ms}ms ease`;
  el.style.opacity = "0";
}

async function hideSplash() {
  const s = document.getElementById("splash");
  if (!s || s.dataset.done) return;
  s.dataset.done = "1";

  const reduce = reduceMotion();
  const minMs = reduce ? TIMING.splashReduceMin : TIMING.splashMin;
  const wait = Math.max(0, minMs - (Date.now() - splashShownAt));
  if (wait) await sleep(wait);

  if (dashboardSettingsPromise) {
    try {
      await Promise.race([
        dashboardSettingsPromise,
        sleep(TIMING.settingsWaitMaxMs)
      ]);
    } catch {}
  }

  const adminWord = document.getElementById("admin-word");
  const splashLogo = s.querySelector(".splash-logo");
  const targetLogo = document.getElementById("target-logo");
  const dash = document.getElementById("dashView");

  if (reduce || !splashLogo || !targetLogo) {
    s.remove();
    if (adminWord) adminWord.style.opacity = "1";
    if (dash) dash.classList.remove("busy");
    revealCurrentView();
    return;
  }

  const sRect = splashLogo.getBoundingClientRect();
  const tRect = targetLogo.getBoundingClientRect();
  const scaleX = sRect.width / tRect.width;
  const scaleY = sRect.height / tRect.height;
  const dx = (sRect.left + sRect.width / 2) - (tRect.left + tRect.width / 2);
  const dy = (sRect.top + sRect.height / 2) - (tRect.top + tRect.height / 2);

  splashLogo.style.opacity = "0";
  targetLogo.style.position = "relative";
  targetLogo.style.zIndex = "50";
  targetLogo.style.transformOrigin = "center center";
  targetLogo.style.transform = `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})`;
  targetLogo.style.willChange = "transform";
  void targetLogo.offsetWidth;

  s.style.transition = "background-color .6s ease";
  s.style.backgroundColor = "transparent";
  s.style.pointerEvents = "none";
  fadeOutNow(s.querySelector(".dots"), 250);
  fadeOutNow(s.querySelector(".note"), 250);

  if (dash) dash.classList.remove("busy");
  revealCurrentView();

  targetLogo.style.transition = `transform ${TIMING.splashFlipMs}ms cubic-bezier(.22,1,.36,1)`;
  targetLogo.style.transform = "translate(0px, 0px) scale(1, 1)";

  if (adminWord) {
    setTimeout(() => {
      adminWord.style.transition = "opacity .5s ease";
      adminWord.style.opacity = "1";
    }, TIMING.splashAdminDelay);
  }

  setTimeout(() => {
    targetLogo.style.transition = "";
    targetLogo.style.transform = "";
    targetLogo.style.transformOrigin = "";
    targetLogo.style.willChange = "";
    targetLogo.style.position = "";
    targetLogo.style.zIndex = "";
    s.remove();
  }, TIMING.splashFlipCleanup);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(hideSplash);
window.addEventListener("load", hideSplash);
setTimeout(hideSplash, TIMING.splashFallback);

/* ================================================================
   Shared overlay helper
   ================================================================ */
function resetOverlayState(el) {
  if (!el) return;
  el.classList.remove("s-circle", "s-tick", "s-undo", "s-err", "s-cross");
}

function showOverlay(el, on, opts = {}) {
  if (!el) return Promise.resolve();
  const { slow = false, note } = opts;

  if (on) {
    const noteEl = el.querySelector(".note");
    if (noteEl && note) noteEl.textContent = note;
    resetOverlayState(el);
    el.style.transition = "none";
    el.classList.remove("hide");
    el.classList.add("gone");
    void el.offsetWidth;
    el.style.transition = "opacity .7s ease";
    el.classList.remove("gone");
    return Promise.resolve();
  }

  const ms = slow ? TIMING.overlayFadeSlowMs : TIMING.overlayFadeMs;
  return new Promise(resolve => {
    el.style.transition = `opacity ${ms}ms ease`;
    el.classList.add("gone");
    setTimeout(() => {
      if (el.classList.contains("gone")) {
        el.classList.add("hide");
        resetOverlayState(el);
      }
      resolve();
    }, ms);
  });
}

async function playSuccess(el, text) {
  if (!el) return;
  if (reduceMotion()) { await sleep(300); return; }
  const note = el.querySelector(".note");
  if (note) note.textContent = text;
  el.classList.add("s-circle"); await sleep(TIMING.successCircle);
  el.classList.add("s-tick");   await sleep(TIMING.successTick);
  el.classList.remove("s-tick");
  el.classList.add("s-undo");   await sleep(TIMING.successUndo);
}

/* ================================================================
   Error animation — ring draws in red, cross draws, then reverses
   ================================================================ */
async function playError(el, text) {
  if (!el) return;
  const oktext = el.querySelector(".oktext");
  const originalText = oktext ? oktext.textContent : "";

  if (reduceMotion()) {
    if (oktext) oktext.textContent = text;
    await sleep(300);
    if (oktext) oktext.textContent = originalText;
    return;
  }

  try {
    if (oktext) oktext.textContent = text;
    el.classList.add("s-circle", "s-err"); await sleep(TIMING.errorCircle);
    el.classList.add("s-cross");           await sleep(TIMING.errorCross);
    el.classList.remove("s-cross");
    el.classList.add("s-undo");            await sleep(TIMING.errorUndo);
  } finally {
    if (oktext) oktext.textContent = originalText;
  }
}

/* ================================================================
   Login
   ================================================================ */
async function handleLogin() {
  const enteredPin = $("#pin").value.trim();
  const btn = $("#loginBtn");
  const msg = $("#loginMsg");
  if (!enteredPin || btn.disabled) return;

  btn.disabled = true;
  msg.textContent = "";
  msg.classList.remove("err", "ok");
  document.body.style.overflow = "hidden";

  const authing = $("#authing");
  const startedAt = Date.now();

  await showOverlay(authing, true, { note: "Logging in…" });
  await sleep(100);

  let success = false;
  let errorMsg = "";

  try {
    const d = await postJSON({ action: "admin", type: "check", pin: enteredPin });
    if (d.ok) {
      success = true;
      pin = enteredPin;
      saveSession(pin);
    } else {
      errorMsg = "Wrong PIN";
    }
  } catch {
    errorMsg = "Connection error.";
  }

  const remaining = Math.max(0, TIMING.overlayMinVisible - (Date.now() - startedAt));
  if (remaining) await sleep(remaining);

  if (success) {
    await playSuccess(authing, "Logged In");
    const fadePromise = showOverlay(authing, false, { slow: true });
    await showDashboard();
    await fadePromise;
    document.body.style.overflow = "";
  } else {
    await playError(authing, errorMsg);
    await showOverlay(authing, false);
    document.body.style.overflow = "";
    msg.classList.add("err");
    msg.textContent = errorMsg;
    await sleep(TIMING.failedLoginDelay);
    btn.disabled = false;
  }
}

$("#loginBtn").addEventListener("click", handleLogin);
$("#pin").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); handleLogin(); }
});
$("#pin").addEventListener("input", e => {
  const cleaned = e.target.value.replace(/\D/g, "").slice(0, 6);
  if (e.target.value !== cleaned) e.target.value = cleaned;
});

/* ================================================================
   Log out
   ================================================================ */
$("#logoutBtn").addEventListener("click", async () => {
  if (isSaving) return;
  const btn = $("#logoutBtn");
  if (btn.disabled) return;
  btn.disabled = true;
  document.body.style.overflow = "hidden";

  clearSession();

  const lo = $("#loggingout");
  const startedAt = Date.now();

  lo.classList.remove("play", "s-circle", "s-tick", "s-undo", "s-err", "s-cross");
  lo.style.transition = "none";
  lo.classList.remove("hide");
  lo.classList.add("gone");
  void lo.offsetWidth;
  lo.style.transition = "opacity .7s ease";
  lo.classList.remove("gone");
  void lo.offsetWidth;
  lo.classList.add("play");

  const minMs = reduceMotion() ? 600 : TIMING.logoutMinVisible;
  const remaining = Math.max(0, minMs - (Date.now() - startedAt));
  if (remaining) await sleep(remaining);

  await new Promise(resolve => {
    lo.style.transition = `opacity ${TIMING.logoutFadeMs}ms ease`;
    lo.classList.add("gone");
    setTimeout(() => {
      lo.classList.add("hide");
      lo.classList.remove("play");
      resolve();
    }, TIMING.logoutFadeMs);
  });

  document.body.style.overflow = "";
  showLogin("Logged out.");
  btn.disabled = false;
});

/* ================================================================
   View switching
   ================================================================ */
async function showDashboard() {
  $("#loginView").classList.add("hide");
  const dash = $("#dashView");
  dash.classList.remove("hide");
  dash.classList.add("busy");
  $$("#dashView > *").forEach(el => el.classList.remove("reveal", "in"));

  dashboardSettingsPromise = loadSettings();
  try { await dashboardSettingsPromise; } catch {}

  const splash = document.getElementById("splash");
  if (!splash || splash.dataset.done) {
    dash.classList.remove("busy");
    revealEls([...$$("#dashView > *")]);
  }
}

function showLogin(message = "") {
  $("#dashView").classList.add("hide");
  const lv = $("#loginView");
  lv.classList.remove("hide", "reveal", "in");
  $("#pin").value = "";
  $("#loginBtn").disabled = false;

  const msg = $("#loginMsg");
  msg.classList.remove("ok");
  msg.classList.add("err");
  msg.textContent = message;

  const splash = document.getElementById("splash");
  if (!splash || splash.dataset.done) {
    requestAnimationFrame(() => revealEls([lv]));
  }
}

/* ================================================================
   Load settings
   ================================================================ */
async function loadSettings() {
  try {
    const d = await getSettings();
    if (!d.ok) {
      showDashMsg("Failed to load settings: " + (d.error || "unknown error"), "err");
      return;
    }

    $("#storeStatus").checked = (d.storeStatus === "OPEN");
    updateStatusText();

    $$(".soldOutDay").forEach(cb => cb.checked = false);
    if (Array.isArray(d.soldOutDays)) {
      d.soldOutDays.forEach(day => {
        const cb = document.querySelector(`.soldOutDay[value="${day}"]`);
        if (cb) cb.checked = true;
      });
    }
  } catch {
    showDashMsg("Failed to load settings", "err");
  }
}

/* ================================================================
   Status toggle
   ================================================================ */
$("#storeStatus").addEventListener("change", updateStatusText);
function updateStatusText() {
  const open = $("#storeStatus").checked;
  const el = $("#statusText");
  el.textContent = open ? "OPEN" : "CLOSED";
  el.style.color = open ? "var(--ok)" : "var(--err)";
}

/* ================================================================
   Save
   ================================================================ */
function setDashInputsDisabled(disabled) {
  $$("#dashView input, #dashView button:not(#logoutBtn)").forEach(el => el.disabled = disabled);
}

$("#saveBtn").addEventListener("click", async () => {
  if (isSaving) return;

  if (!sessionValid()) {
    clearSession();
    showLogin("Session expired. Please log in again.");
    return;
  }

  isSaving = true;
  const btn = $("#saveBtn");
  btn.disabled = true;
  setDashInputsDisabled(true);
  showDashMsg("", "");
  document.body.style.overflow = "hidden";

  try {
    const storeStatus = $("#storeStatus").checked ? "OPEN" : "CLOSED";
    const soldOutDays = Array.from($$(".soldOutDay:checked")).map(cb => cb.value);
    const startedAt = Date.now();

    const saving = $("#saving");
    await showOverlay(saving, true, { note: "Saving your changes…" });
    await sleep(100);

    let succeeded = false;
    let sessionExpired = false;

    try {
      const d = await postJSON({
        action: "admin", type: "update", pin,
        storeStatus, soldOutDays
      });
      if (d.ok) {
        succeeded = true;
      } else {
        const errText = String(d.error || "").toLowerCase();
        if (/pin|auth|session|expired/.test(errText)) {
          sessionExpired = true;
        } else {
          showDashMsg("Error saving: " + (d.error || "unknown error"), "err");
        }
      }
    } catch {
      showDashMsg("Connection error.", "err");
    }

    const remaining = Math.max(0, TIMING.overlayMinVisible - (Date.now() - startedAt));
    if (remaining) await sleep(remaining);

    if (succeeded) {
      await playSuccess(saving, "Changes saved");
      await showOverlay(saving, false, { slow: true });
      showDashMsg("Saved successfully!", "ok");
    } else {
      await showOverlay(saving, false);
    }

    if (sessionExpired) {
      clearSession();
      showLogin("Session expired. Please log in again.");
    }
  } finally {
    document.body.style.overflow = "";
    btn.disabled = false;
    setDashInputsDisabled(false);
    isSaving = false;
  }
});

/* ================================================================
   Message helper
   ================================================================ */
function showDashMsg(text, type) {
  const m = $("#dashMsg");
  m.textContent = text;
  m.classList.remove("err", "ok");
  if (type) m.classList.add(type);
}

/* ================================================================
   Boot
   ================================================================ */
(function bootSession() {
  const raw = sessionStorage.getItem("cayers_pin");
  if (!raw) return;

  if (!sessionValid()) {
    clearSession();
    $("#loginMsg").textContent = "Session expired. Please log in again.";
    return;
  }

  pin = raw;
  showDashboard();
  validateSession();
})();

async function validateSession() {
  if (!sessionValid()) {
    clearSession();
    showLogin("Session expired. Please log in again.");
    return;
  }
  const stored = sessionStorage.getItem("cayers_pin");
  try {
    const d = await postJSON({ action: "admin", type: "check", pin: stored });
    if (!d.ok) {
      clearSession();
      showLogin("Session expired. Please log in again.");
    }
  } catch {
    // network failure — keep session so the user can retry
  }
}

/* ================================================================
   Periodic expiry check
   ================================================================ */
setInterval(() => {
  if (!$("#dashView").classList.contains("hide") && !sessionValid()) {
    clearSession();
    showLogin("Session expired due to inactivity.");
  }
}, 60 * 1000);
</script>
